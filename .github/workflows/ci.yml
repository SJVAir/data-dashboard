name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # Playwright's image ships the browsers and every system package they need, so no run installs
    # them. Installing per run (`playwright install --with-deps`) downloads about 200 Ubuntu
    # packages from the runner's mirror, which has stalled jobs for up to an hour. The tag must be
    # the installed Playwright's version; scripts/ci-playwright-image.test.ts checks it.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      # The runner's user, as Playwright's docs advise (Firefox refuses to run as root here).
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run paraglide
      - run: npm run lint
      - run: npm run check
      - run: npm test
      # Vitest's failure screenshots from browser-mode tests.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vitest-failure-screenshots
          path: .vitest/attachments/
          retention-days: 7
          if-no-files-found: ignore
      - run: npm run build
      - run: npm run check:build
      - run: npm run check:budget

  # Chromium only, for PRs that don't run e2e-full (which covers Chromium too). Keep the
  # condition the exact opposite of e2e-full's.
  e2e-chromium:
    needs: checks
    if: ${{ !(github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || github.base_ref == 'foundations' || github.base_ref == 'layout') }}
    runs-on: ubuntu-latest
    # Playwright's image (see the checks job).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-chromium
          path: playwright-report/
          retention-days: 7

  e2e-full:
    name: e2e-full (${{ matrix.browser }})
    needs: checks
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || github.base_ref == 'foundations' || github.base_ref == 'layout'
    runs-on: ubuntu-latest
    # Playwright's image (see the checks job).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        include:
          # Chromium also runs the drag performance check (its own project).
          - browser: chromium
            projects: --project=chromium --project=chromium-perf
          - browser: firefox
            projects: --project=firefox
          - browser: webkit
            projects: --project=webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright test ${{ matrix.projects }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
